name: iOS validation
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  validate:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: python3 scripts/verify-config.py
      - run: npx playwright install webkit
      - run: node scripts/qa-web.mjs --offline
      - run: bash scripts/test-ios.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-results
          path: |
            docs/verification/
            output/*.xcresult
            output/qa/*-*.png
          retention-days: 14
